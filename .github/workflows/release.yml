name: Release

# Builds the Linux .deb, Windows .msi, and macOS .dmg installers for the Session Visualizer and
# publishes them as assets on the GitHub Release matching the pushed tag - automating steps 7-11 of
# docs/Making-a-release.md. Triggered by pushing a version tag (see group.gradle.properties for the
# current tag scheme, e.g. "17-0.33.5"); workflow_dispatch is included so this can be test-run against
# an existing tag without cutting a new release.

on:
  push:
    tags:
      - '17-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (for testing this workflow without cutting a new release)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build .deb via the Docker image
        run: |
          cd docker/debian
          docker build --tag scs2-debian-ci .
          docker run \
            --rm \
            --user $(id -u):$(id -g) \
            --volume ${{ github.workspace }}:/simulation-construction-set-2 \
            scs2-debian-ci gradle buildDebianPackage

      - uses: actions/upload-artifact@v4
        with:
          name: scs2-deb
          path: scs2-session-visualizer-jfx/deployment/debian/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # windows-latest images generally carry WiX already, but pin it explicitly so this doesn't
      # silently start failing if a future image drops it.
      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build Windows MSI
        run: gradle :scs2-session-visualizer-jfx:buildWindowsPackagesJlink

      - uses: actions/upload-artifact@v4
        with:
          name: scs2-msi
          path: scs2-session-visualizer-jfx/deployment/windows/msi-jlink/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build macOS DMG
        run: gradle :scs2-session-visualizer-jfx:buildMacPackagesJlink

      - uses: actions/upload-artifact@v4
        with:
          name: scs2-dmg
          path: scs2-session-visualizer-jfx/deployment/mac/dmg-jlink/*.dmg
          if-no-files-found: error

  release:
    needs: [ build-linux, build-windows, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update the GitHub Release with all three installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/scs2-deb/*.deb
            artifacts/scs2-msi/*.msi
            artifacts/scs2-dmg/*.dmg
